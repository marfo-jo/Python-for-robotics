<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>selftest: running</title>
</head>
<body>
<!-- Browser smoke test (local only, not deployed). Serve the repo root, then open
     http://localhost:8000/tools/selftest.html?lesson=m00.l01  or  ?all=1
     It runs Pyodide checks that mirror tools/verify.py: examples, predict answers,
     starter fails, reference passes (from verification/), wrongs fail, bug, tracer, sim. -->
<pre id="out">starting…</pre>
<script type="module">
import { runCode, runTests, traceCode, runSim } from "../app/runner/runner.js";

const out = document.getElementById("out");
const lines = [];
let failures = 0;
const log = (ok, msg) => { if (!ok) failures++; lines.push(`${ok ? "PASS" : "FAIL"} ${msg}`); out.textContent = lines.join("\n"); };
const text = async (p) => { const r = await fetch(p, { cache: "no-cache" }); if (!r.ok) throw new Error(`${p} ${r.status}`); return r.text(); };
const json = async (p) => JSON.parse(await text(p));
const norm = (s) => s.trim().split("\n").map((l) => l.trimEnd()).join("\n");
const exists = async (p) => (await fetch(p, { method: "HEAD" })).ok;

async function checkLesson(mod, lid) {
  const base = `../content/modules/m00-python-foundations/${mod.lessonDirs[lid]}`;
  const meta = await json(`${base}/lesson.json`);
  for (const ex of meta.examples) {
    const res = await runCode(await text(`${base}/${ex.file}`));
    log(!res.error && norm(res.stdout) === norm(ex.expectedOutput), `${lid} example ${ex.id} (pyodide)${res.error ? " " + res.error.type + ": " + res.error.message : ""}`);
  }
  for (const p of meta.predict) {
    const res = await runCode(p.code);
    const actual = res.error ? (norm(res.stdout) ? norm(res.stdout) + "\n" : "") + res.error.type : norm(res.stdout);
    log(actual === norm(p.choices[p.answer]), `${lid} predict ${p.id} (got ${JSON.stringify(actual)})`);
  }
  for (const v of meta.visualizations.filter((x) => x.component === "tracer")) {
    const res = await traceCode(v.props.code);
    log(res.steps && res.steps.length > 0, `${lid} tracer ${v.id}: ${res.steps?.length} steps`);
  }
  const tests = await text(`${base}/${meta.challenge.tests}`);
  const starter = await runTests(await text(`${base}/${meta.challenge.starter}`), tests, { testName: "test_challenge.py" });
  log(!starter.ok, `${lid} starter fails (${starter.passed}/${starter.total})`);
  const key = `../verification/${lid}`;
  if (await exists(`${key}/challenge.py`)) {
    const ref = await runTests(await text(`${key}/challenge.py`), tests, { testName: "test_challenge.py" });
    log(ref.ok, `${lid} reference passes (${ref.passed}/${ref.total}) ${ref.collectErrors?.join(" ") || ""}`);
  } else log(false, `${lid} no reference in verification/`);
  const btests = await text(`${base}/${meta.bug.tests}`);
  const buggy = await runTests(await text(`${base}/${meta.bug.file}`), btests, { testName: "test_bug.py" });
  log(!buggy.ok, `${lid} buggy fails (${buggy.passed}/${buggy.total})`);
  if (await exists(`${key}/bug_fixed.py`)) {
    const fixed = await runTests(await text(`${key}/bug_fixed.py`), btests, { testName: "test_bug.py" });
    log(fixed.ok, `${lid} bug fix passes (${fixed.passed}/${fixed.total})`);
  }
}

// Load the real app in an iframe and check that key pages render without errors.
async function checkUI() {
  const frame = document.createElement("iframe");
  frame.style.cssText = "width:1200px;height:900px";
  document.body.append(frame);
  const errors = [];
  const visit = (hash, ready) => new Promise((resolve) => {
    frame.onload = () => {
      const win = frame.contentWindow;
      win.addEventListener("error", (e) => errors.push(`${hash}: ${e.message}`));
      win.addEventListener("unhandledrejection", (e) => errors.push(`${hash}: ${e.reason}`));
      const t0 = Date.now();
      const poll = setInterval(() => {
        const doc = frame.contentDocument;
        if (ready(doc) || Date.now() - t0 > 20000) { clearInterval(poll); resolve(doc); }
      }, 250);
    };
    // A unique query forces a real navigation; a hash-only change wouldn't fire onload.
    frame.src = `../index.html?visit=${Math.random().toString(36).slice(2)}${hash}`;
  });
  const routes = [
    ["#/", (d) => d.querySelector(".radar"), "dashboard renders with radar"],
    ["#/m/m00", (d) => d.querySelector(".lesson-list li"), "module page lists lessons"],
    ["#/l/m00/m00.l01", (d) => d.querySelectorAll(".CodeMirror").length >= 8 && d.querySelector(".mastery h2"), "lesson 0.1 renders all embeds"],
    ["#/l/m00/m00.l01", (d) => d.querySelectorAll("details.ref").length >= 3 && [...d.querySelectorAll("details.ref summary")].some((s) => s.textContent.includes("$GPGGA fields")),
      "lesson 0.1 shows the GGA reference table (prose, visual, bug)"],
    ["#/review", (d) => d.querySelector("main h1"), "review page renders"],
    ["#/sim", (d) => d.querySelector(".sim-canvas"), "simulator page renders"],
    ["#/settings", (d) => d.querySelector("main h1"), "settings page renders"],
    ["#/t/sprints", (d) => d.querySelector("main h1"), "sprints track index renders"],
  ];
  for (const [hash, ready, label] of routes) {
    const doc = await visit(hash, ready);
    const bad = [...doc.querySelectorAll(".alert.bad")].map((e) => e.textContent.trim()).join(" | ");
    log(Boolean(ready(doc)) && !bad, `UI ${label}${bad ? " :: " + bad : ""}`);
  }
  // Ligatures off in every code surface, in both themes (!= must not render as ≠).
  for (const theme of ["light", "dark"]) {
    const doc = await visit("#/l/m00/m00.l01", (d) => d.querySelectorAll(".CodeMirror-line").length > 0);
    doc.documentElement.setAttribute("data-theme", theme);
    const els = [...doc.querySelectorAll(".CodeMirror-line, .CodeMirror-line span, code, pre, .tracer-note")];
    const lig = els.filter((e) => {
      const s = frame.contentWindow.getComputedStyle(e);
      return s.fontVariantLigatures !== "none" || !/"liga" 0/.test(s.fontFeatureSettings) || !/"calt" 0/.test(s.fontFeatureSettings);
    });
    log(els.length > 0 && lig.length === 0, `UI ligatures disabled in ${els.length} code elements (${theme} theme)${lig.length ? ` :: ${lig.length} still ligated, e.g. ${lig[0].className || lig[0].tagName}` : ""}`);
  }
  // Seed progress so every lesson is unlocked, then render each lesson page and
  // the quiz / project / No Hands pages.
  const mod = await json("../content/modules/m00-python-foundations/module.json");
  const lessons = {};
  for (const id of mod.lessons) lessons[id] = { challengePassed: true, bugFixed: true, explainDone: true, predict: {}, attempts: 0, code: {}, masteredAt: "2026-10-28T00:00:00Z" };
  localStorage.setItem("pfr.progress.v1", JSON.stringify({ version: 1, lessons, quizzes: {}, noHands: {}, projects: {}, tracks: {}, review: {}, activity: {}, streak: { best: 0 }, settings: { theme: "auto" } }));
  for (const id of mod.lessons) {
    const doc = await visit(`#/l/m00/${id}`, (d) => d.querySelector(".mastery h2") && d.querySelectorAll(".exercise").length >= 2);
    const bad = [...doc.querySelectorAll(".alert.bad")].map((e) => e.textContent.trim()).join(" | ");
    const embedsEmpty = [...doc.querySelectorAll(".embed")].filter((e) => !e.children.length).length;
    log(Boolean(doc.querySelector(".mastery h2")) && !bad && !embedsEmpty, `UI ${id} renders (${doc.querySelectorAll(".CodeMirror").length} editors)${bad ? " :: " + bad : ""}${embedsEmpty ? ` :: ${embedsEmpty} empty embeds` : ""}`);
    // Predict-first: the code or sentence shows before the prediction (the question
    // is about it); only the interactive part is hidden, and it opens after predicting.
    for (const fig of doc.querySelectorAll("figure.viz")) {
      const gate = fig.querySelector(".predict-first");
      if (!gate) continue;
      const shown = (e) => e && e.getClientRects().length > 0;
      const inputs = fig.querySelector(".tracer-code .CodeMirror, .viz-nmea input.wide, .viz-xor input.wide");
      const before = Boolean(inputs) && shown(inputs) && Boolean(inputs.compareDocumentPosition(gate) & Node.DOCUMENT_POSITION_FOLLOWING);
      const gated = () => [...fig.querySelectorAll(".tracer-stepper, .viz-nmea > div:last-child, .viz-xor > div:last-child")];
      const hiddenBefore = gated().length === 1 && !shown(gated()[0]);
      gate.querySelector("textarea").value = "my guess";
      gate.querySelector("button").click();
      const openAfter = gated().length === 1 && shown(gated()[0]) && !fig.querySelector(".predict-first");
      log(before && hiddenBefore && openAfter,
        `UI ${id} predict-first "${fig.querySelector(".example-title")?.textContent || "visual"}": inputs visible ${before}, interaction gated ${hiddenBefore}, opens after predicting ${openAfter}`);
    }
  }
  for (const [hash, ready, label] of [
    ["#/quiz/m00", (d) => d.querySelectorAll(".quiz fieldset").length === 15, "mastery quiz draws 15 questions"],
    ["#/project/m00", (d) => d.querySelector(".lesson-body details.ref"), "project brief shows its reference tables"],
    ["#/project/m00", (d) => d.querySelector(".exercise"), "project page renders"],
    ["#/nohands/m00", (d) => d.querySelector(".timer"), "No Hands page renders"],
    ["#/m/m00", (d) => d.querySelector(".bridge-robots") && d.querySelector(".bridge-cpp"), "module page shows both Bridge boxes"],
  ]) {
    const doc = await visit(hash, ready);
    const bad = [...doc.querySelectorAll(".alert.bad")].map((e) => e.textContent.trim()).join(" | ");
    log(Boolean(ready(doc)) && !bad, `UI ${label}${bad ? " :: " + bad : ""}`);
  }
  const cur = await json("../content/curriculum.json");
  for (const track of cur.tracks) {
    for (const page of track.pages.filter((p) => p.status !== "planned")) {
      const doc = await visit(`#/t/${track.id}/${page.id}`, (d) => d.querySelector(".lesson-body")?.children.length && [...d.querySelectorAll(".lesson-body img")].every((i) => i.complete));
      const bad = [...doc.querySelectorAll(".alert.bad")].map((e) => e.textContent.trim()).join(" | ");
      const brokenImg = [...doc.querySelectorAll(".lesson-body img")].filter((i) => !i.complete || i.naturalWidth === 0).length;
      log(!bad && !brokenImg && doc.querySelector(".lesson-body")?.children.length > 0,
        `UI track ${page.id} renders${bad ? " :: " + bad : ""}${brokenImg ? ` :: ${brokenImg} broken images` : ""}`);
    }
  }
  localStorage.clear();
  log(errors.length === 0, `UI no uncaught errors ${errors.join(" ; ")}`);
  frame.remove();
}

async function main() {
  const params = new URLSearchParams(location.search);
  if (params.get("ui") === "1") {
    try { localStorage.clear(); } catch { /* fresh-learner view */ }
    await checkUI();
    lines.push(`\n${failures === 0 ? "SELFTEST PASS" : `SELFTEST FAIL (${failures})`}`);
    return finish();
  }
  const t0 = performance.now();
  const hello = await runCode("print('hello from pyodide')");
  log(hello.stdout.trim() === "hello from pyodide", `pyodide boots (${((performance.now() - t0) / 1000).toFixed(1)}s)`);
  const err = await runCode("x = [1]\nprint(x[3])");
  log(err.error?.type === "IndexError" && err.error.lineno === 2, "IndexError reported with line number");
  const loop = await runCode("while True:\n    pass", 2000);
  log(loop.error?.type === "TimeoutError", "infinite loop is stopped by timeout");
  const after = await runCode("print(2 + 2)");
  log(after.stdout.trim() === "4", "worker recovers after timeout");
  const np = await runCode("import numpy as np\nprint(np.arange(3).sum())");
  log(np.stdout.trim() === "3", `numpy loads ${np.error ? np.error.message : ""}`);
  const mpl = await runCode("import matplotlib.pyplot as plt\nplt.plot([1,2,3])\nprint('ok')", 60000);
  log(mpl.stdout.trim() === "ok" && mpl.figures?.length === 1, `matplotlib renders a figure ${mpl.error ? mpl.error.message : ""}`);
  if (params.get("cv") === "1") {
    const cv = await runCode("import cv2\nprint(cv2.__version__)", 90000);
    log(!cv.error, `opencv loads: ${cv.stdout.trim()} ${cv.error ? cv.error.message : ""}`);
  }
  const worlds = await json("../content/sim/worlds.json");
  const sim = await runSim(await text("../content/sim/starter_controller.py"), worlds.arena.world, 10, 1);
  log(!sim.error && sim.frames?.length === 200, `simulator runs (${sim.frames?.length} frames) ${sim.error ? sim.error.message : ""}`);

  const mod = await json("../content/modules/m00-python-foundations/module.json");
  const only = params.get("lesson");
  for (const lid of mod.lessons) {
    if (only && lid !== only) continue;
    try {
      await checkLesson(mod, lid);
    } catch (e) {
      log(false, `${lid}: ${e.message}`);
    }
  }
  if (!only) await checkModuleExtras(mod);
  lines.push(`\n${failures === 0 ? "SELFTEST PASS" : `SELFTEST FAIL (${failures})`}`);
  finish();
}

// Project, No Hands, and runnable quiz items under Pyodide (mirrors verify.py).
async function checkModuleExtras(mod) {
  const base = "../content/modules/m00-python-foundations";
  for (const [name, prefix, testName] of [["project", "project", "test_project.py"], ["noHands", "nohands", "test_nohands.py"]]) {
    const cfg = mod[name];
    if (!cfg) continue;
    const extraFiles = {};
    for (const [dest, src] of Object.entries(cfg.dataFiles || {})) extraFiles[dest] = await text(`../${src}`);
    const tests = await text(`${base}/${cfg.tests}`);
    const opts = { testName, extraFiles, timeoutMs: 30000 };
    const starter = await runTests(await text(`${base}/${cfg.starter}`), tests, opts);
    log(!starter.ok, `m00 ${name} starter fails (${starter.passed}/${starter.total})`);
    const refPath = `../verification/m00/${prefix}.py`;
    if (await exists(refPath)) {
      const ref = await runTests(await text(refPath), tests, opts);
      log(ref.ok, `m00 ${name} reference passes (${ref.passed}/${ref.total}) ${ref.collectErrors?.join(" ") || ""}`);
    } else log(false, `m00 ${name} reference missing`);
  }
  const quiz = await json(`${base}/${mod.quiz}`);
  let checked = 0;
  for (const q of quiz.pool.filter((x) => x.code && x.checkOutput)) {
    const res = await runCode(q.code);
    const actual = res.error ? (norm(res.stdout) ? norm(res.stdout) + "\n" : "") + res.error.type : norm(res.stdout);
    const ok = actual === norm(q.choices[q.answer]);
    if (!ok) log(false, `m00 quiz ${q.id} (got ${JSON.stringify(actual)})`);
    checked += 1;
  }
  log(true, `m00 quiz: ${checked} runnable items checked in Pyodide`);
}

function finish() {
  out.textContent = lines.join("\n");
  document.title = "selftest: done";
  if (new URLSearchParams(location.search).get("report") === "1") {
    fetch("/__selftest_result", { method: "POST", body: lines.join("\n") });
  }
}
main().catch((e) => { lines.push("CRASH " + e.stack, "SELFTEST FAIL (crash)"); finish(); });
</script>
</body>
</html>
