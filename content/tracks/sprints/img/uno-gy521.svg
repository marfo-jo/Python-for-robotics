<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Arduino Uno R3 to GY-521 (MPU-6050) wiring</title>
  <desc id="d">Four wires: Uno 5V to GY-521 VCC, Uno GND to GND, Uno A4 (SDA) to SDA, Uno A5 (SCL) to SCL. XDA, XCL, AD0 and INT are not connected. The Uno connects to the laptop by USB.</desc>
  <rect x="2" y="2" width="796" height="576" rx="18" fill="#ffffff" stroke="#c9ced6" stroke-width="2"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Sprint 1 wiring: Arduino Uno R3 to GY-521 (MPU-6050)</text>

  <!-- Uno -->
  <rect x="40" y="70" width="230" height="300" rx="10" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2.5"/>
  <text x="155" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79">Arduino Uno R3</text>
  <text x="155" y="117" text-anchor="middle" font-size="12" fill="#1f2328">5 V logic, ATmega328P</text>
  <g font-size="14" fill="#1f2328" text-anchor="end">
    <text x="250" y="160">5V</text>
    <text x="250" y="200">GND</text>
    <text x="250" y="240">A4 (SDA)</text>
    <text x="250" y="280">A5 (SCL)</text>
    <text x="250" y="320" fill="#6a737d">3.3V (not used)</text>
  </g>
  <g fill="#1f2328"><circle cx="270" cy="155" r="5"/><circle cx="270" cy="195" r="5"/><circle cx="270" cy="235" r="5"/><circle cx="270" cy="275" r="5"/></g>
  <circle cx="270" cy="315" r="5" fill="#ffffff" stroke="#6a737d" stroke-width="2"/>
  <!-- USB -->
  <rect x="10" y="335" width="60" height="26" rx="4" fill="#d0d7de" stroke="#1f2328" stroke-width="1.5"/>
  <text x="40" y="353" text-anchor="middle" font-size="12" fill="#1f2328">USB</text>
  <text x="20" y="392" font-size="12" fill="#1f2328">USB cable to the laptop</text>
  <text x="20" y="408" font-size="12" fill="#1f2328">(power + serial, COMx)</text>

  <!-- GY-521 -->
  <rect x="540" y="70" width="210" height="380" rx="10" fill="#eef7ee" stroke="#2d6a2d" stroke-width="2.5"/>
  <text x="645" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#2d6a2d">GY-521</text>
  <text x="645" y="117" text-anchor="middle" font-size="12" fill="#1f2328">MPU-6050, I2C address 0x68</text>
  <g font-size="14" fill="#1f2328">
    <text x="565" y="160">VCC</text>
    <text x="565" y="200">GND</text>
    <text x="565" y="240">SCL</text>
    <text x="565" y="280">SDA</text>
    <text x="565" y="320" fill="#6a737d">XDA (not connected)</text>
    <text x="565" y="355" fill="#6a737d">XCL (not connected)</text>
    <text x="565" y="390" fill="#6a737d">AD0 (not connected)</text>
    <text x="565" y="425" fill="#6a737d">INT (not connected)</text>
  </g>
  <g fill="#1f2328"><circle cx="540" cy="155" r="5"/><circle cx="540" cy="195" r="5"/><circle cx="540" cy="235" r="5"/><circle cx="540" cy="275" r="5"/></g>
  <g fill="#ffffff" stroke="#6a737d" stroke-width="2"><circle cx="540" cy="315" r="5"/><circle cx="540" cy="350" r="5"/><circle cx="540" cy="385" r="5"/><circle cx="540" cy="420" r="5"/></g>

  <!-- Wires -->
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M275 155 H535" stroke="#c62828"/>
    <path d="M275 195 H535" stroke="#1f2328"/>
    <!-- A4 SDA goes to GY SDA (lower); A5 SCL to GY SCL (upper): they cross -->
    <path d="M275 235 C 380 235, 430 275, 535 275" stroke="#1565c0"/>
    <path d="M275 275 C 380 275, 430 235, 535 235" stroke="#b26a00"/>
  </g>
  <g font-size="12" font-weight="600">
    <text x="405" y="147" text-anchor="middle" fill="#c62828">red: 5V to VCC</text>
    <text x="405" y="187" text-anchor="middle" fill="#1f2328">black: GND to GND</text>
    <text x="330" y="224" fill="#1565c0">blue: SDA (data)</text>
    <text x="330" y="300" fill="#b26a00">orange: SCL (clock)</text>
  </g>

  <!-- notes -->
  <rect x="30" y="470" width="740" height="94" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-size="13" fill="#1f2328">
    <text x="46" y="494">Keep the four I2C wires short (under 20 cm). GY-521: onboard 3.3 V regulator, so 5V on VCC is fine;</text>
    <text x="46" y="514">its I2C pull-ups go to 3.3 V. AD0 is pulled low on the board, so the address is 0x68 (AD0 to 3.3 V gives 0x69).</text>
    <text x="46" y="534">The Uno's SDA/SCL header pins near AREF are the same signals as A4/A5: use one or the other.</text>
    <text x="46" y="554">Unplug USB before changing any wire.</text>
  </g>
</svg>
