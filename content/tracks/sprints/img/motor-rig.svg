<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 820" width="1060" height="820" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Sprint 2 motor test rig wiring</title>
  <desc id="d">12 V bench supply positive through a 2 A fuse into INA219 VIN+, out of VIN- into the L298N +12V terminal. Supply negative is the star ground: a heavy wire to the L298N GND terminal, and a separate logic ground to the Uno, INA219, encoder and DS18B20. L298N OUT1 and OUT2 drive the motor. L298N ENA, IN1, IN2 go to Uno D9, D7, D8. Encoder A and B go to D2 and D3. INA219 SCL and SDA go to A5 and A4. DS18B20 data goes to D4 with a 4.7 kilohm pull-up to 5 V.</desc>
  <rect x="2" y="2" width="1056" height="816" rx="18" fill="#ffffff" stroke="#c9ced6" stroke-width="2"/>
  <text x="530" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">Sprint 2 wiring: DC motor test rig (pin positions drawn for clarity, not to scale)</text>

  <!-- ============ heavy power wiring ============ -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- motor ground: star point to L298N GND, over the top -->
    <path d="M40 150 H20 V44 H700 V70" stroke="#1f2328" stroke-width="6"/>
    <!-- +12 V: supply + to fuse -->
    <path d="M200 100 H245" stroke="#c62828" stroke-width="6"/>
    <!-- fuse to INA219 VIN+ -->
    <path d="M305 100 H345" stroke="#c62828" stroke-width="6"/>
    <!-- INA219 VIN- to L298N +12V -->
    <path d="M555 100 H625" stroke="#c62828" stroke-width="6"/>
    <!-- motor leads -->
    <path d="M800 120 H865" stroke="#455a64" stroke-width="5"/>
    <path d="M800 165 H865" stroke="#8d6e63" stroke-width="5"/>
  </g>
  <text x="560" y="92" font-size="11" font-weight="600" fill="#c62828">+12 V</text>
  <text x="808" y="113" font-size="11" fill="#1f2328">OUT1</text>
  <text x="808" y="158" font-size="11" fill="#1f2328">OUT2</text>

  <!-- 12 V supply -->
  <rect x="40" y="70" width="160" height="130" rx="8" fill="#fff4e5" stroke="#b26a00" stroke-width="2.5"/>
  <text x="120" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#7a4800">12 V bench supply</text>
  <text x="120" y="190" text-anchor="middle" font-size="11" fill="#1f2328">2 A minimum, 3 A preferred</text>
  <text x="192" y="104" text-anchor="end" font-size="13" fill="#1f2328">+12V</text>
  <text x="50" y="154" font-size="13" fill="#1f2328">− (GND)</text>
  <circle cx="200" cy="100" r="5" fill="#1f2328"/><circle cx="40" cy="150" r="5" fill="#1f2328"/>
  <circle cx="20" cy="150" r="7" fill="#1f2328"/>
  <text x="26" y="232" font-size="12" font-weight="700" fill="#1f2328">STAR</text>
  <text x="26" y="247" font-size="12" font-weight="700" fill="#1f2328">GND</text>
  <text x="26" y="262" font-size="11" fill="#1f2328">(supply −)</text>

  <!-- fuse -->
  <rect x="245" y="88" width="60" height="24" rx="12" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <path d="M250 100 H300" stroke="#1f2328" stroke-width="1.5"/>
  <text x="275" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">2 A fuse</text>

  <!-- INA219 -->
  <rect x="345" y="60" width="210" height="180" rx="8" fill="#f3e8fb" stroke="#6a1b9a" stroke-width="2.5"/>
  <text x="450" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#4a148c">INA219 (I2C 0x40)</text>
  <text x="450" y="150" text-anchor="middle" font-size="12" fill="#1f2328">high side, 0.1 Ω shunt</text>
  <text x="450" y="166" text-anchor="middle" font-size="12" fill="#1f2328">max 26 V, ±3.2 A</text>
  <text x="355" y="96" font-size="12" fill="#1f2328">VIN+</text>
  <text x="545" y="96" text-anchor="end" font-size="12" fill="#1f2328">VIN−</text>
  <circle cx="345" cy="100" r="5" fill="#1f2328"/><circle cx="555" cy="100" r="5" fill="#1f2328"/>
  <g font-size="12" fill="#1f2328" text-anchor="middle">
    <text x="380" y="230">VCC</text><text x="420" y="230">GND</text><text x="470" y="230">SCL</text><text x="510" y="230">SDA</text>
  </g>
  <g fill="#1f2328"><circle cx="380" cy="240" r="5"/><circle cx="420" cy="240" r="5"/><circle cx="470" cy="240" r="5"/><circle cx="510" cy="240" r="5"/></g>

  <!-- L298N -->
  <rect x="625" y="70" width="175" height="260" rx="8" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2.5"/>
  <text x="712" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79">L298N</text>
  <text x="712" y="208" text-anchor="middle" font-size="11" fill="#1f2328">remove the ENA jumper</text>
  <text x="712" y="222" text-anchor="middle" font-size="11" fill="#1f2328">(the Uno drives ENA with PWM)</text>
  <text x="712" y="240" text-anchor="middle" font-size="11" fill="#6a737d">IN3, IN4, ENB, OUT3, OUT4:</text>
  <text x="712" y="253" text-anchor="middle" font-size="11" fill="#6a737d">not connected</text>
  <text x="635" y="104" font-size="12" fill="#1f2328">+12V</text>
  <text x="700" y="90" text-anchor="middle" font-size="12" fill="#1f2328">GND</text>
  <text x="760" y="90" text-anchor="middle" font-size="12" fill="#6a737d">+5V</text>
  <text x="760" y="62" text-anchor="middle" font-size="11" fill="#6a737d">not connected</text>
  <circle cx="625" cy="100" r="5" fill="#1f2328"/><circle cx="700" cy="70" r="5" fill="#1f2328"/>
  <circle cx="760" cy="70" r="5" fill="#ffffff" stroke="#6a737d" stroke-width="2"/>
  <circle cx="800" cy="120" r="5" fill="#1f2328"/><circle cx="800" cy="165" r="5" fill="#1f2328"/>
  <g font-size="12" fill="#1f2328" text-anchor="middle">
    <text x="650" y="320">ENA</text><text x="690" y="320">IN1</text><text x="730" y="320">IN2</text>
  </g>
  <g fill="#1f2328"><circle cx="650" cy="330" r="5"/><circle cx="690" cy="330" r="5"/><circle cx="730" cy="330" r="5"/></g>

  <!-- Motor + encoder -->
  <rect x="865" y="70" width="170" height="260" rx="8" fill="#eef7ee" stroke="#2d6a2d" stroke-width="2.5"/>
  <text x="950" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#1b5e20">JGA25-370</text>
  <text x="950" y="227" text-anchor="middle" font-size="12" fill="#1f2328">12 V gear motor</text>
  <text x="950" y="243" text-anchor="middle" font-size="12" fill="#1f2328">+ Hall quadrature</text>
  <text x="950" y="259" text-anchor="middle" font-size="12" fill="#1f2328">encoder</text>
  <text x="875" y="124" font-size="12" fill="#1f2328">M+ (motor)</text>
  <text x="875" y="169" font-size="12" fill="#1f2328">M− (motor)</text>
  <circle cx="865" cy="120" r="5" fill="#1f2328"/><circle cx="865" cy="165" r="5" fill="#1f2328"/>
  <!-- 0.1 uF across motor terminals -->
  <path d="M845 120 V136 M837 136 H853 M837 144 H853 M845 144 V165" stroke="#1f2328" stroke-width="2" fill="none"/>
  <circle cx="845" cy="120" r="3" fill="#1f2328"/><circle cx="845" cy="165" r="3" fill="#1f2328"/>
  <text x="845" y="188" text-anchor="middle" font-size="11" fill="#1f2328">0.1 µF</text>
  <g font-size="11" fill="#1f2328" text-anchor="middle">
    <text x="880" y="300">ENC</text><text x="880" y="314">VCC</text>
    <text x="920" y="300">ENC</text><text x="920" y="314">GND</text>
    <text x="960" y="300">C1</text><text x="960" y="314">(A)</text>
    <text x="1000" y="300">C2</text><text x="1000" y="314">(B)</text>
  </g>
  <g fill="#1f2328"><circle cx="880" cy="330" r="5"/><circle cx="920" cy="330" r="5"/><circle cx="960" cy="330" r="5"/><circle cx="1000" cy="330" r="5"/></g>

  <!-- ============ logic rails ============ -->
  <g fill="none" stroke-linecap="round">
    <path d="M60 410 H1015" stroke="#c62828" stroke-width="3"/>
    <path d="M20 150 V430 H1015" stroke="#1f2328" stroke-width="3"/>
  </g>
  <text x="540" y="402" font-size="12" font-weight="700" fill="#c62828">5 V logic</text>
  <text x="540" y="447" font-size="12" font-weight="700" fill="#1f2328">logic GND</text>

  <!-- taps to rails (junction dots) -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M380 240 V410" stroke="#c62828"/>
    <path d="M420 240 V430" stroke="#1f2328"/>
    <path d="M880 330 V410" stroke="#c62828"/>
    <path d="M920 330 V430" stroke="#1f2328"/>
    <path d="M300 520 V410" stroke="#c62828"/>
    <path d="M340 520 V430" stroke="#1f2328"/>
    <path d="M80 520 V410" stroke="#c62828"/>
    <path d="M190 520 V430" stroke="#1f2328"/>
  </g>
  <g fill="#1f2328">
    <circle cx="380" cy="410" r="5"/><circle cx="420" cy="430" r="5"/><circle cx="880" cy="410" r="5"/><circle cx="920" cy="430" r="5"/>
    <circle cx="300" cy="410" r="5"/><circle cx="340" cy="430" r="5"/><circle cx="80" cy="410" r="5"/><circle cx="190" cy="430" r="5"/>
    <circle cx="20" cy="150" r="5"/>
  </g>

  <!-- ============ signal wires ============ -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M470 240 V520" stroke="#b26a00"/>
    <path d="M510 240 V520" stroke="#1565c0"/>
    <path d="M650 330 V520" stroke="#6a1b9a"/>
    <path d="M690 330 V520" stroke="#00796b"/>
    <path d="M730 330 V520" stroke="#5d4037"/>
    <path d="M960 330 V520" stroke="#2e7d32"/>
    <path d="M1000 330 V520" stroke="#ad1457"/>
    <path d="M220 570 H260" stroke="#827717"/>
  </g>
  <g font-size="11" font-weight="600">
    <text x="474" y="476" fill="#b26a00">SCL</text>
    <text x="514" y="496" fill="#1565c0">SDA</text>
    <text x="654" y="476" fill="#6a1b9a">PWM</text>
    <text x="964" y="476" fill="#2e7d32">A</text>
    <text x="1004" y="496" fill="#ad1457">B</text>
  </g>

  <!-- 4.7k pull-up from 5 V rail to DQ -->
  <path d="M240 410 V470 l-7 5 l14 6 l-14 6 l14 6 l-14 6 l14 6 l-7 5 V570" fill="none" stroke="#1f2328" stroke-width="2"/>
  <circle cx="240" cy="410" r="4" fill="#1f2328"/><circle cx="240" cy="570" r="4" fill="#1f2328"/>
  <text x="250" y="486" font-size="12" font-weight="700" fill="#1f2328">4.7 kΩ</text>
  <text x="250" y="501" font-size="11" fill="#1f2328">DQ to 5V</text>

  <!-- DS18B20 -->
  <rect x="40" y="520" width="180" height="90" rx="8" fill="#fdecea" stroke="#b71c1c" stroke-width="2.5"/>
  <text x="130" y="575" text-anchor="middle" font-size="13" font-weight="700" fill="#7f0000">DS18B20 probe</text>
  <text x="130" y="592" text-anchor="middle" font-size="11" fill="#1f2328">taped to the motor can</text>
  <text x="80" y="540" text-anchor="middle" font-size="11" fill="#1f2328">VDD (red)</text>
  <text x="180" y="540" text-anchor="middle" font-size="11" fill="#1f2328">GND (black)</text>
  <text x="212" y="560" text-anchor="end" font-size="11" fill="#1f2328">DQ (yellow)</text>
  <circle cx="80" cy="520" r="5" fill="#1f2328"/><circle cx="190" cy="520" r="5" fill="#1f2328"/><circle cx="220" cy="570" r="5" fill="#1f2328"/>

  <!-- Uno -->
  <rect x="260" y="520" width="775" height="100" rx="10" fill="#e3f2fd" stroke="#0d47a1" stroke-width="2.5"/>
  <text x="840" y="580" text-anchor="middle" font-size="15" font-weight="700" fill="#0d47a1">Arduino Uno R3</text>
  <text x="840" y="598" text-anchor="middle" font-size="11" fill="#1f2328">USB to laptop: power + serial (COMx)</text>
  <g font-size="11" fill="#1f2328" text-anchor="middle">
    <text x="300" y="540">5V</text><text x="340" y="540">GND</text>
    <text x="470" y="540">A5</text><text x="470" y="553">SCL</text>
    <text x="510" y="540">A4</text><text x="510" y="553">SDA</text>
    <text x="650" y="540">D9</text><text x="650" y="553">PWM</text>
    <text x="690" y="540">D7</text><text x="730" y="540">D8</text>
    <text x="960" y="540">D2</text><text x="960" y="553">INT0</text>
    <text x="1000" y="540">D3</text><text x="1000" y="553">INT1</text>
  </g>
  <text x="268" y="574" font-size="11" fill="#1f2328">D4</text>
  <g fill="#1f2328">
    <circle cx="300" cy="520" r="5"/><circle cx="340" cy="520" r="5"/><circle cx="470" cy="520" r="5"/><circle cx="510" cy="520" r="5"/>
    <circle cx="650" cy="520" r="5"/><circle cx="690" cy="520" r="5"/><circle cx="730" cy="520" r="5"/>
    <circle cx="960" cy="520" r="5"/><circle cx="1000" cy="520" r="5"/><circle cx="260" cy="570" r="5"/>
  </g>

  <!-- notes -->
  <rect x="20" y="640" width="1020" height="164" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-size="13" fill="#1f2328">
    <text x="36" y="664" font-weight="700">Read before powering up. Heavy red/black lines carry motor current (use 18 to 20 AWG); thin lines are logic.</text>
    <text x="36" y="686">• Turn the 12 V supply OFF before changing any wire. Plug USB in first, 12 V last; switch 12 V off first.</text>
    <text x="36" y="706">• Never connect the L298N +5V pin, or the 12 V supply, to the Uno 5V pin. The motor never runs from USB power.</text>
    <text x="36" y="726">• All grounds meet at one star point. Motor current returns on the heavy wire, never through the Uno or the sensor wires.</text>
    <text x="36" y="746">• Encoder colors vary by seller: check your motor's label (often M1, GND, C1, C2, VCC, M2) and meter the wires first.</text>
    <text x="36" y="766">• Twist the two motor leads together and keep them away from the encoder and I2C wires. Clamp the motor before running it.</text>
    <text x="36" y="786">• The L298N drops about 2 V, so the motor sees about 10 V at 100% duty. Its heatsink gets hot: don't touch it during tests.</text>
  </g>
</svg>
