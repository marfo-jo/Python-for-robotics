<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Sprint 1 binary frame: 23 bytes</title>
  <desc id="d">Bytes 0 and 1 are the sync pattern 0xA5 0x5A. Byte 2 is the sequence number. Bytes 3 to 6 are t_ms, uint32 little-endian. Bytes 7 to 20 are seven int16 values, little-endian: ax, ay, az, temperature, gx, gy, gz. Bytes 21 and 22 are the 8-bit Fletcher checksum CK_A and CK_B, computed over bytes 2 to 20.</desc>
  <rect x="2" y="2" width="896" height="326" rx="18" fill="#ffffff" stroke="#c9ced6" stroke-width="2"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">Sprint 1 binary frame (23 bytes, sent 100 times per second)</text>
  <text x="72.0" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#b26a00">SYNC</text>
  <path d="M38 90 V96 H106 V90" fill="none" stroke="#b26a00" stroke-width="1.5"/>
  <rect x="36" y="110" width="36" height="44" fill="#fff4e5" stroke="#b26a00" stroke-width="1.5"/>
  <text x="54.0" y="136" text-anchor="middle" font-size="10.5" fill="#1f2328">0xA5</text>
  <text x="54.0" y="170" text-anchor="middle" font-size="10" fill="#57606a">0</text>
  <rect x="72" y="110" width="36" height="44" fill="#fff4e5" stroke="#b26a00" stroke-width="1.5"/>
  <text x="90.0" y="136" text-anchor="middle" font-size="10.5" fill="#1f2328">0x5A</text>
  <text x="90.0" y="170" text-anchor="middle" font-size="10" fill="#57606a">1</text>
  <text x="126.0" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#1f4e79">SEQ</text>
  <path d="M126 66 V88" stroke="#1f4e79" stroke-width="1.5"/>
  <path d="M110 90 V96 H142 V90" fill="none" stroke="#1f4e79" stroke-width="1.5"/>
  <rect x="108" y="110" width="36" height="44" fill="#e8f1fb" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="126.0" y="136" text-anchor="middle" font-size="10.5" fill="#1f2328">seq</text>
  <text x="126.0" y="170" text-anchor="middle" font-size="10" fill="#57606a">2</text>
  <text x="216.0" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#2d6a2d">t_ms (uint32, little-endian)</text>
  <path d="M146 90 V96 H286 V90" fill="none" stroke="#2d6a2d" stroke-width="1.5"/>
  <rect x="144" y="110" width="36" height="44" fill="#eef7ee" stroke="#2d6a2d" stroke-width="1.5"/>
  <text x="162.0" y="136" text-anchor="middle" font-size="10.5" fill="#1f2328">b0</text>
  <text x="162.0" y="170" text-anchor="middle" font-size="10" fill="#57606a">3</text>
  <rect x="180" y="110" width="36" height="44" fill="#eef7ee" stroke="#2d6a2d" stroke-width="1.5"/>
  <text x="198.0" y="136" text-anchor="middle" font-size="10.5" fill="#1f2328">b1</text>
  <text x="198.0" y="170" text-anchor="middle" font-size="10" fill="#57606a">4</text>
  <rect x="216" y="110" width="36" height="44" fill="#eef7ee" stroke="#2d6a2d" stroke-width="1.5"/>
  <text x="234.0" y="136" text-anchor="middle" font-size="10.5" fill="#1f2328">b2</text>
  <text x="234.0" y="170" text-anchor="middle" font-size="10" fill="#57606a">5</text>
  <rect x="252" y="110" width="36" height="44" fill="#eef7ee" stroke="#2d6a2d" stroke-width="1.5"/>
  <text x="270.0" y="136" text-anchor="middle" font-size="10.5" fill="#1f2328">b3</text>
  <text x="270.0" y="170" text-anchor="middle" font-size="10" fill="#57606a">6</text>
  <text x="540.0" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#6a1b9a">payload: 7 × int16, little-endian (low byte first)</text>
  <path d="M290 90 V96 H790 V90" fill="none" stroke="#6a1b9a" stroke-width="1.5"/>
  <rect x="288" y="110" width="36" height="44" fill="#f3e8fb" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="306.0" y="136" text-anchor="middle" font-size="10.5" fill="#1f2328">ax L</text>
  <text x="306.0" y="170" text-anchor="middle" font-size="10" fill="#57606a">7</text>
  <rect x="324" y="110" width="36" height="44" fill="#f3e8fb" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="342.0" y="136" text-anchor="middle" font-size="10.5" fill="#1f2328">ax H</text>
  <text x="342.0" y="170" text-anchor="middle" font-size="10" fill="#57606a">8</text>
  <rect x="360" y="110" width="36" height="44" fill="#f3e8fb" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="378.0" y="136" text-anchor="middle" font-size="10.5" fill="#1f2328">ay L</text>
  <text x="378.0" y="170" text-anchor="middle" font-size="10" fill="#57606a">9</text>
  <rect x="396" y="110" width="36" height="44" fill="#f3e8fb" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="414.0" y="136" text-anchor="middle" font-size="10.5" fill="#1f2328">ay H</text>
  <text x="414.0" y="170" text-anchor="middle" font-size="10" fill="#57606a">10</text>
  <rect x="432" y="110" width="36" height="44" fill="#f3e8fb" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="450.0" y="136" text-anchor="middle" font-size="10.5" fill="#1f2328">az L</text>
  <text x="450.0" y="170" text-anchor="middle" font-size="10" fill="#57606a">11</text>
  <rect x="468" y="110" width="36" height="44" fill="#f3e8fb" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="486.0" y="136" text-anchor="middle" font-size="10.5" fill="#1f2328">az H</text>
  <text x="486.0" y="170" text-anchor="middle" font-size="10" fill="#57606a">12</text>
  <rect x="504" y="110" width="36" height="44" fill="#f3e8fb" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="522.0" y="136" text-anchor="middle" font-size="10.5" fill="#1f2328">T L</text>
  <text x="522.0" y="170" text-anchor="middle" font-size="10" fill="#57606a">13</text>
  <rect x="540" y="110" width="36" height="44" fill="#f3e8fb" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="558.0" y="136" text-anchor="middle" font-size="10.5" fill="#1f2328">T H</text>
  <text x="558.0" y="170" text-anchor="middle" font-size="10" fill="#57606a">14</text>
  <rect x="576" y="110" width="36" height="44" fill="#f3e8fb" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="594.0" y="136" text-anchor="middle" font-size="10.5" fill="#1f2328">gx L</text>
  <text x="594.0" y="170" text-anchor="middle" font-size="10" fill="#57606a">15</text>
  <rect x="612" y="110" width="36" height="44" fill="#f3e8fb" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="630.0" y="136" text-anchor="middle" font-size="10.5" fill="#1f2328">gx H</text>
  <text x="630.0" y="170" text-anchor="middle" font-size="10" fill="#57606a">16</text>
  <rect x="648" y="110" width="36" height="44" fill="#f3e8fb" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="666.0" y="136" text-anchor="middle" font-size="10.5" fill="#1f2328">gy L</text>
  <text x="666.0" y="170" text-anchor="middle" font-size="10" fill="#57606a">17</text>
  <rect x="684" y="110" width="36" height="44" fill="#f3e8fb" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="702.0" y="136" text-anchor="middle" font-size="10.5" fill="#1f2328">gy H</text>
  <text x="702.0" y="170" text-anchor="middle" font-size="10" fill="#57606a">18</text>
  <rect x="720" y="110" width="36" height="44" fill="#f3e8fb" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="738.0" y="136" text-anchor="middle" font-size="10.5" fill="#1f2328">gz L</text>
  <text x="738.0" y="170" text-anchor="middle" font-size="10" fill="#57606a">19</text>
  <rect x="756" y="110" width="36" height="44" fill="#f3e8fb" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="774.0" y="136" text-anchor="middle" font-size="10.5" fill="#1f2328">gz H</text>
  <text x="774.0" y="170" text-anchor="middle" font-size="10" fill="#57606a">20</text>
  <text x="828.0" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#b71c1c">CHECKSUM</text>
  <path d="M794 90 V96 H862 V90" fill="none" stroke="#b71c1c" stroke-width="1.5"/>
  <rect x="792" y="110" width="36" height="44" fill="#fdecea" stroke="#b71c1c" stroke-width="1.5"/>
  <text x="810.0" y="136" text-anchor="middle" font-size="10.5" fill="#1f2328">CK_A</text>
  <text x="810.0" y="170" text-anchor="middle" font-size="10" fill="#57606a">21</text>
  <rect x="828" y="110" width="36" height="44" fill="#fdecea" stroke="#b71c1c" stroke-width="1.5"/>
  <text x="846.0" y="136" text-anchor="middle" font-size="10.5" fill="#1f2328">CK_B</text>
  <text x="846.0" y="170" text-anchor="middle" font-size="10" fill="#57606a">22</text>
  <text x="36" y="188" font-size="11" fill="#57606a">byte offset</text>
  <path d="M110 202 V210 H790 V202" fill="none" stroke="#b71c1c" stroke-width="2"/>
  <text x="450.0" y="228" text-anchor="middle" font-size="12" font-weight="600" fill="#b71c1c">checksum covers bytes 2 to 20 (SEQ through the payload; never the sync bytes)</text>
  <text x="36" y="258" font-size="12" fill="#1f2328">8-bit Fletcher: start with CK_A = CK_B = 0; for each covered byte b: CK_A = (CK_A + b) mod 256, then CK_B = (CK_B + CK_A) mod 256.</text>
  <text x="36" y="278" font-size="12" fill="#1f2328">The MPU-6050 registers are big-endian (high byte first). The AVR stores int16 little-endian. The frame uses little-endian.</text>
  <text x="36" y="298" font-size="12" fill="#1f2328">23 bytes × 10 bits per byte on the wire × 100 frames/s = 23,000 bit/s: 20% of a 115200 baud link.</text>
</svg>
